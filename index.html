<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Net worth</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  :root {
    --canvas: #ffffff;
    --bg: #ffffff;
    --surface: #f6f6f6;
    --line: #e6e6e6;
    --text: #111111;
    --muted: #6b6b6b;
    --gain: #157a45;
    --loss: #c4362c;
    --focus: #1b3a4b;
    --accent: #1b3a4b;
    --accent-ink: #ffffff;
    --c-us: #1b3a4b;
    --c-in: #c4a35a;
    --c-bcash: #3e6b8a;
    --c-bank: #2f5d50;
    --c-pf: #8c6b4a;
    --c-other: #5c6b7a;
    --s1: #1b3a4b;
    --s2: #c4a35a;
    --s3: #3e6b8a;
    --s4: #2f5d50;
    --s5: #8c6b4a;
    --s6: #5c6b7a;
    --s7: #244e66;
    --s8: #a68448;
    --display: "Plus Jakarta Sans", "Segoe UI", system-ui, sans-serif;
    --body: "Plus Jakarta Sans", "Segoe UI", system-ui, sans-serif;
    color-scheme: light;
  }
  * { box-sizing: border-box; }
  html { -webkit-text-size-adjust: 100%; }
  body {
    margin: 0;
    min-height: 100vh;
    background: var(--bg);
    color: var(--text);
    font: 400 15px/1.5 var(--body);
  }
  button, input, select { font: inherit; color: inherit; }
  button { cursor: pointer; }
  :focus-visible { outline: 2px solid var(--focus); outline-offset: 2px; }
  .shell {
    min-height: 100vh;
    background: var(--bg); color: var(--text);
    display: grid; grid-template-columns: 228px minmax(0, 1fr);
  }
  .side {
    padding: 22px 14px 18px; border-right: 1px solid var(--line);
    display: flex; flex-direction: column; min-width: 0;
    position: sticky; top: 0; height: 100vh; overflow-y: auto;
  }
  .side-brand { display: flex; align-items: center; gap: 10px; padding: 4px 10px 8px; }
  .mark {
    width: 34px; height: 34px; border-radius: 11px; flex: none;
    background: var(--accent); color: var(--accent-ink);
    display: grid; place-items: center;
  }
  .side-brand strong { display: block; font: 700 .95rem/1.15 var(--display); letter-spacing: -.02em; }
  .side-brand small { color: var(--muted); font-size: .72rem; }
  .side-label {
    margin: 16px 12px 6px; font-size: .68rem; font-weight: 700; letter-spacing: .08em;
    text-transform: uppercase; color: var(--muted);
  }
  .nav-btn {
    display: flex; align-items: center; gap: 10px; width: 100%;
    border: 0; background: none; color: var(--muted); text-align: left;
    padding: 9px 12px; border-radius: 12px; font-weight: 600;
  }
  .nav-btn svg { flex: none; }
  .nav-btn:hover { background: var(--surface); color: var(--text); }
  .nav-btn[aria-current="page"] { background: var(--accent); color: var(--accent-ink); }
  .nav-btn[aria-current="page"]:hover { background: var(--accent); color: var(--accent-ink); }
  .maincol { min-width: 0; display: flex; flex-direction: column; }
  .topbar {
    display: flex; align-items: center; justify-content: space-between; gap: 16px;
    padding: 20px 22px 6px;
  }
  .topbar h1 { margin: 0; font: 700 1.2rem/1.2 var(--display); letter-spacing: -.03em; }
  .crumb { margin: 3px 0 0; color: var(--muted); font-size: .8rem; }
  .tools { display: flex; gap: 8px; align-items: center; flex-wrap: wrap; justify-content: flex-end; }
  .search {
    display: flex; align-items: center; gap: 8px;
    background: var(--surface); border: 1px solid var(--line); border-radius: 999px;
    padding: 7px 12px; color: var(--muted);
  }
  .search input { border: 0; background: none; padding: 0; width: 148px; outline: none; color: var(--text); }
  .search input::placeholder { color: var(--muted); }
  .seg-ctl { display: inline-flex; border: 1px solid var(--line); background: var(--surface); border-radius: 999px; padding: 3px; }
  .seg-ctl button { border: 0; background: none; padding: 5px 12px; border-radius: 999px; color: var(--muted); font-weight: 600; }
  .seg-ctl button[aria-pressed="true"] { background: var(--accent); color: var(--accent-ink); }
  .icon-btn {
    border: 1px solid var(--line); background: var(--surface); border-radius: 999px;
    width: 36px; height: 36px; padding: 0; color: var(--muted);
    display: inline-grid; place-items: center;
  }
  .icon-btn[aria-pressed="true"] { color: var(--accent); border-color: var(--accent); }
  .content { padding: 12px 22px 26px; }

  .status {
    display: inline-flex; align-items: center; gap: 6px; margin: 0;
    border: 1px solid var(--line); background: var(--surface); border-radius: 999px;
    padding: 6px 10px 6px 12px; font-size: .78rem; color: var(--muted);
  }
  .status .dot { width: 7px; height: 7px; border-radius: 50%; background: var(--muted); flex: none; }
  .status.live .dot { background: var(--gain); }
  .status.offline .dot { background: var(--loss); }
  .status.partial .dot { background: var(--focus); }
  .status .lnk { color: var(--muted); text-decoration: none; font-weight: 500; }
  .status .lnk:hover { color: var(--text); }
  .lnk { background: none; border: 0; padding: 0; color: var(--text); text-decoration: underline; text-underline-offset: 3px; text-decoration-color: var(--line); font-size: inherit; }
  .lnk:hover { text-decoration-color: currentColor; }
  .lnk.del:hover { color: var(--loss); }

  .gain { color: var(--gain); }
  .loss { color: var(--loss); }

  .kpis { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 12px; margin-bottom: 12px; }
  .charts { display: grid; grid-template-columns: 1.05fr .95fr .9fr; gap: 12px; margin-bottom: 12px; }
  .lower { display: grid; grid-template-columns: 1fr 1fr 1fr; gap: 12px; }
  .kpi, .card {
    background: var(--surface); border: 1px solid var(--line); border-radius: 16px; padding: 16px;
  }
  .kpi-label, .card h3 {
    margin: 0; font-size: .68rem; font-weight: 700; letter-spacing: .07em;
    text-transform: uppercase; color: var(--muted);
  }
  .card h3 { font: 700 .92rem/1.2 var(--display); letter-spacing: -.02em; text-transform: none; color: var(--text); margin-bottom: 14px; }
  .kpi-value {
    margin: 10px 0 4px; font: 700 clamp(1.05rem, 1.5vw, 1.45rem)/1.15 var(--display);
    letter-spacing: -.03em; font-variant-numeric: tabular-nums; overflow-wrap: anywhere;
  }
  .kpi-sub { margin: 0; color: var(--muted); font-size: .8rem; }
  .charts .card { display: flex; flex-direction: column; }
  .mix { display: flex; align-items: center; gap: 8px 14px; flex: 1; }
  .legend { list-style: none; margin: 0; padding: 0; flex: 1; min-width: 108px; display: grid; gap: 0; }
  .legend button {
    display: flex; width: 100%; align-items: center; gap: 8px;
    background: none; border: 0; padding: 3px 0; color: var(--text); font-weight: 500; font-size: .82rem; line-height: 1.25; text-align: left;
  }
  .legend button:hover { color: var(--accent); }
  .legend b { margin-left: auto; color: var(--muted); font-weight: 600; font-variant-numeric: tabular-nums; }
  .bars { display: block; width: 100%; flex: 1; min-height: 150px; }
  .bars text { font-family: var(--body); }
  .prow { margin: 0 0 12px; }
  .prow:last-child { margin-bottom: 0; }
  .prow-top { display: flex; justify-content: space-between; gap: 10px; font-size: .84rem; margin-bottom: 6px; }
  .prow-top b { font-weight: 600; font-variant-numeric: tabular-nums; }
  .track { height: 7px; border-radius: 99px; background: color-mix(in srgb, var(--line) 85%, var(--bg)); overflow: hidden; }
  .track i { display: block; height: 100%; border-radius: 99px; background: var(--accent); }
  .track i.alt { background: color-mix(in srgb, var(--muted) 70%, var(--line)); }
  .activity { list-style: none; margin: 0; padding: 0; }
  .activity li {
    display: flex; align-items: center; justify-content: space-between; gap: 10px;
    padding: 9px 0; border-top: 1px solid var(--line); font-size: .875rem;
  }
  .activity li:first-child { border-top: 0; padding-top: 0; }
  .activity .when { color: var(--muted); font-size: .75rem; min-width: 3.2rem; text-align: right; }
  .dotc { width: 7px; height: 7px; border-radius: 50%; display: inline-block; margin-right: 8px; vertical-align: 1px; }
  .status-big { margin: 6px 0 2px; font: 700 2rem/1 var(--display); letter-spacing: -.04em; color: var(--accent); }
  .status-big.offline, .status-big.partial { color: var(--loss); }
  .status-big.loading { color: var(--muted); }
  .stat-pills { display: flex; gap: 8px; margin-top: 16px; }
  .pill { flex: 1; background: var(--bg); border-radius: 12px; padding: 10px 8px; text-align: center; }
  .pill b { display: block; font: 700 .92rem/1.2 var(--display); font-variant-numeric: tabular-nums; }
  .pill span { color: var(--muted); font-size: .7rem; }

  .split {
    display: grid; grid-template-columns: auto minmax(0, 1fr);
    gap: 8px 36px; align-items: center; margin-bottom: 8px;
  }
  .donut { position: relative; flex: none; }
  .donut svg { display: block; }
  .donut .slice { cursor: default; }
  .donut:hover .slice { opacity: .42; }
  .donut .slice:hover { opacity: 1; }
  .tip {
    position: fixed; z-index: 30; pointer-events: none;
    background: var(--surface); color: var(--text);
    border: 1px solid var(--line); border-radius: 8px;
    padding: 8px 10px; font-size: .8125rem; line-height: 1.35;
  }
  .tip[hidden] { display: none; }
  .tip b { display: block; font-weight: 600; }
  .donut.intro { animation: pop .7s cubic-bezier(.2,.7,.2,1) both; }
  @keyframes pop { from { transform: scale(.92); opacity: 0; } to { transform: none; opacity: 1; } }
  @media (prefers-reduced-motion: reduce) { .donut.intro { animation: none; } }
  .sw { width: 12px; height: 12px; border-radius: 3px; display: block; flex: none; }
  .legend .sw { width: 8px; height: 8px; border-radius: 50%; }
  .iname { display: flex; align-items: flex-start; gap: 10px; }
  .iname .sw { flex: none; margin-top: 4px; }
  .iname > span { min-width: 0; }
  .dash { color: var(--muted); }

  .panel { padding-top: 4px; }

  h2 { font: 700 1.15rem/1.2 var(--display); letter-spacing: -.02em; margin: 0; }
  h3 { font: 700 1rem/1.2 var(--display); margin: 0; }
  .head { display: flex; align-items: center; gap: 12px; flex-wrap: wrap; margin-bottom: 8px; }
  .head h2 { margin-right: auto; }
  .head .tot { color: var(--muted); font-variant-numeric: tabular-nums; }
  .head .tot b { color: var(--text); font-weight: 600; }
  .btn { background: var(--accent); color: var(--accent-ink); border: 0; border-radius: 999px; padding: 8px 14px; font-weight: 600; }
  .btn.ghost { background: var(--bg); color: var(--text); border: 1px solid var(--line); }
  .btn.ghost:hover { border-color: var(--accent); color: var(--accent); }
  .btn.danger { color: var(--loss); border-color: var(--loss); }
  .btn.danger:hover { color: var(--loss); border-color: var(--loss); }
  .block {
    background: var(--surface); border: 1px solid var(--line); border-radius: 16px;
    padding: 16px 16px 8px; margin-bottom: 12px;
  }
  .block + .block { margin-top: 0; }

  .ghead {
    display: flex; align-items: baseline; justify-content: space-between; gap: 12px;
    padding: 20px 4px 6px; color: var(--muted);
  }
  .ghead h3 { font: 600 .9375rem/1.3 var(--body); }
  .ghead .tot { font-variant-numeric: tabular-nums; font-size: .875rem; }
  .ghead:first-child { padding-top: 8px; }

  .tw { overflow-x: auto; container-type: inline-size; }
  table { width: 100%; border-collapse: collapse; font-variant-numeric: tabular-nums; }
  small.only-sm { display: none; }
  td .contrib { display: inline; margin-left: 12px; font-weight: 500; }
  th { text-align: left; font-weight: 600; color: var(--muted); font-size: .72rem; letter-spacing: .04em; text-transform: uppercase; padding: 10px 10px 8px; white-space: nowrap; }
  td { padding: 12px 10px; border-top: 1px solid var(--line); vertical-align: top; }
  th .sort { background: none; border: 0; padding: 0; color: inherit; font: inherit; font-weight: 500; cursor: pointer; }
  th[aria-sort="ascending"] .sort::after { content: " ↑"; }
  th[aria-sort="descending"] .sort::after { content: " ↓"; }
  tr.go { cursor: pointer; }
  tr.go:hover td { background: color-mix(in srgb, var(--accent) 8%, var(--surface)); }
  table[data-sid="cats"] th, table[data-sid="cats"] td { padding-left: 14px; padding-right: 14px; }
  table[data-sid="cats"] td { padding-top: 14px; padding-bottom: 14px; vertical-align: middle; }
  table[data-sid="cats"] th:nth-child(2), table[data-sid="cats"] td:nth-child(2) { width: 26%; }
  table[data-sid="cats"] th:nth-child(3), table[data-sid="cats"] td:nth-child(3) { width: 16%; }
  table[data-sid="cats"] th:nth-child(4), table[data-sid="cats"] td:nth-child(4) { width: 24%; }
  .iname:not(:has(small)) { align-items: center; }
  .iname:not(:has(small)) .sw { margin-top: 0; }
  th.r, td.r { text-align: right; white-space: nowrap; }
  td small, .meta { display: block; color: var(--muted); font-size: .8125rem; font-weight: 400; }
  td.act { white-space: nowrap; width: 1%; }
  td.act .lnk + .lnk { margin-left: 12px; }
  tr .act { opacity: 0; }
  tr:hover .act, tr:focus-within .act { opacity: 1; }
  @media (hover: none) { tr .act { opacity: 1; } }
  .src { display: block; font-size: .75rem; color: var(--muted); }
  .src-live { color: var(--gain); }
  .src-cost { color: var(--loss); }
  .empty { margin: 0; padding: 18px 0; color: var(--muted); border-top: 1px solid var(--line); }
  .note { color: var(--muted); font-size: .875rem; max-width: 62ch; margin: 12px 0 0; }
  .log { margin: 14px 0 0; padding: 0; list-style: none; font-size: .875rem; color: var(--muted); }
  .log li { display: flex; gap: 14px; padding: 3px 0; }

  .start { border: 1px dashed var(--line); border-radius: 16px; padding: 28px; background: var(--surface); }
  .start p { margin: 0 0 14px; max-width: 56ch; color: var(--muted); }
  .start .row { display: flex; gap: 10px; flex-wrap: wrap; }

  .field { display: grid; gap: 6px; margin-bottom: 18px; max-width: 460px; }
  .field label, .field .label { font-weight: 600; }
  .field .hint, .hint { color: var(--muted); font-size: .875rem; }
  input, select { background: var(--bg); border: 1px solid var(--line); border-radius: 10px; padding: 9px 11px; width: 100%; }
  .row { display: flex; gap: 10px; flex-wrap: wrap; }

  .themes { display: flex; flex-wrap: wrap; gap: 10px; max-width: none; }
  .theme-btn {
    border: 1px solid var(--line); background: none; border-radius: 10px;
    padding: 10px 12px 9px; min-width: 104px; text-align: left; font-weight: 600;
  }
  .theme-btn[aria-pressed="true"] { border-color: var(--text); color: var(--text); }
  .theme-btn .chips { display: flex; height: 10px; border-radius: 3px; overflow: hidden; margin-bottom: 8px; }
  .theme-btn .chips i { flex: 1; display: block; }

  dialog { background: var(--bg); color: var(--text); border: 1px solid var(--line); border-radius: 18px; padding: 24px; width: min(440px, calc(100vw - 32px)); }
  dialog::backdrop { background: rgba(28, 25, 23, .35); }
  dialog .field { max-width: none; margin-bottom: 14px; }
  dialog input, dialog select { background: var(--surface); }
  dialog .hint { margin: 0 0 14px; }
  .adv { margin: 0 0 14px; }
  .adv summary { color: var(--muted); cursor: pointer; font-weight: 600; margin-bottom: 10px; }
  .err { color: var(--loss); margin: 0 0 12px; font-size: .875rem; min-height: 0; }
  .actions { display: flex; justify-content: end; gap: 10px; margin-top: 8px; }

  body.masked .num { filter: blur(16px); user-select: none; }
  body.masked h1.total { filter: blur(1.2em); }

  @media (max-width: 980px) {
    .shell { grid-template-columns: 1fr; }
    .side { position: static; height: auto; border-right: 0; border-bottom: 1px solid var(--line); padding: 14px 12px 10px; }
    .side-brand { padding-bottom: 8px; }
    .side-label { display: none; }
    .side nav { display: flex; gap: 4px; overflow-x: auto; scrollbar-width: none; }
    .side nav::-webkit-scrollbar { display: none; }
    .nav-btn { width: auto; flex: none; white-space: nowrap; }
    .kpis, .charts, .lower { grid-template-columns: 1fr 1fr; }
    .topbar { flex-wrap: wrap; padding: 16px 16px 4px; }
    .content { padding: 12px 16px 24px; }
  }
  @media (max-width: 720px) {
    .split { grid-template-columns: 1fr; justify-items: center; }
    .split .tw { width: 100%; }
    .kpis, .charts, .lower { grid-template-columns: 1fr; }
    .search input { width: 100px; }
    th, td { padding-left: 6px; padding-right: 6px; }
    table[data-sid="cats"] th, table[data-sid="cats"] td { padding-left: 6px; padding-right: 6px; }
    table[data-sid="cats"] th:nth-child(n+2), table[data-sid="cats"] td:nth-child(n+2) { width: auto; }
    td .contrib { display: block; margin: 4px 0 0; }
  }
  @container (max-width: 640px) {
    th.hide-sm, td.hide-sm, td small.hide-sm { display: none; }
    small.only-sm { display: flex; flex-wrap: wrap; gap: 2px 8px; }
    small.only-sm span { white-space: nowrap; }
  }
</style>
</head>
<body>
<noscript>This dashboard needs JavaScript.</noscript>
<div class="shell" id="app"></div>
<div id="tip" class="tip" hidden></div>

<dialog id="dlg" aria-labelledby="dlg-title">
  <form id="frm" autocomplete="off"></form>
</dialog>
<datalist id="brokers"></datalist>
<input type="file" id="file" accept="application/json" hidden>

<script>
(() => {
'use strict';

/* ---------- state ---------- */
const KEY = 'networth.v1';
const $ = (s, r = document) => r.querySelector(s);
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const uid = () => Math.random().toString(36).slice(2, 9);

const BASE = {
  light: {
    '--canvas':'#ffffff','--bg':'#ffffff','--surface':'#f6f6f6','--line':'#e6e6e6',
    '--text':'#111111','--muted':'#6b6b6b','--gain':'#157a45','--loss':'#c4362c'
  },
  dark: {
    '--canvas':'#000000','--bg':'#000000','--surface':'#141414','--line':'#2a2a2a',
    '--text':'#f5f5f5','--muted':'#9a9a9a','--gain':'#5dca8a','--loss':'#f07167'
  }
};
const PALETTES = {
  light: {
    navy: {
      label: 'Navy',
      '--accent':'#1b3a4b','--accent-ink':'#ffffff','--focus':'#1b3a4b',
      '--c-us':'#1b3a4b','--c-in':'#c4a35a','--c-bcash':'#3e6b8a','--c-bank':'#2f5d50','--c-pf':'#8c6b4a','--c-other':'#5c6b7a',
      '--s1':'#1b3a4b','--s2':'#c4a35a','--s3':'#3e6b8a','--s4':'#2f5d50','--s5':'#8c6b4a','--s6':'#5c6b7a','--s7':'#244e66','--s8':'#a68448'
    },
    harbor: {
      label: 'Harbor',
      '--accent':'#0f5c56','--accent-ink':'#ffffff','--focus':'#0f5c56',
      '--c-us':'#0f5c56','--c-in':'#c47b4a','--c-bcash':'#3d7a78','--c-bank':'#1a3c40','--c-pf':'#8aa6a2','--c-other':'#5e4a38',
      '--s1':'#0f5c56','--s2':'#c47b4a','--s3':'#3d7a78','--s4':'#1a3c40','--s5':'#8aa6a2','--s6':'#5e4a38','--s7':'#1f6f68','--s8':'#a36a3c'
    },
    indigo: {
      label: 'Indigo',
      '--accent':'#2f3f73','--accent-ink':'#ffffff','--focus':'#2f3f73',
      '--c-us':'#2f3f73','--c-in':'#7a6a4f','--c-bcash':'#5b6eae','--c-bank':'#1e2a4a','--c-pf':'#4e7c8a','--c-other':'#6b5b7a',
      '--s1':'#2f3f73','--s2':'#7a6a4f','--s3':'#5b6eae','--s4':'#1e2a4a','--s5':'#4e7c8a','--s6':'#6b5b7a','--s7':'#3d4f8a','--s8':'#8a7a5c'
    }
  },
  dark: {
    brass: {
      label: 'Brass',
      '--accent':'#e0a84a','--accent-ink':'#1a1408','--focus':'#e0a84a',
      '--c-us':'#e0a84a','--c-in':'#f0d59a','--c-bcash':'#7ba3d4','--c-bank':'#c48a3a','--c-pf':'#a8b8d0','--c-other':'#d4b483',
      '--s1':'#e0a84a','--s2':'#7ba3d4','--s3':'#f0d59a','--s4':'#c48a3a','--s5':'#a8b8d0','--s6':'#d4b483','--s7':'#4a6fa5','--s8':'#f2e2bc'
    },
    steel: {

const paletteId = mode => {

const defaults = () => ({
  settings: { base: 'INR', backend: '', fxManual: null, fxManualAt: 0, thbManual: null, thbManualAt: 0, mask: false, mode: 'light', palette: { light: 'navy', dark: 'brass' } },
  us: [], in: [], bcash: [], bank: [], pf: [], other: [],
  cache: { quotes: {} }

const merge = r => {

};
const load = () => { try { const r = JSON.parse(localStorage.getItem(KEY)); if (r) return merge(r); } catch (e) {} return defaults(); };
let S = load();
const remote = { on: false, state: 'off', timer: null, rev: 0, sending: false, dirty: false };   // state: off | saving | saved | error | conflict

function resolveMode() {
  if (S.settings.mode === 'light' || S.settings.mode === 'dark') return S.settings.mode;

function applyTheme() {

  Object.entries(BASE[mode]).forEach(([k, v]) => root.style.setProperty(k, v));

function save() {
  try { localStorage.setItem(KEY, JSON.stringify(S)); } catch (e) {}
  if (!remote.on) return;
  remote.dirty = true;
  remote.state = 'saving';
  updateSyncNote();
  clearTimeout(remote.timer);
  remote.timer = setTimeout(pushRemote, 400);
}
function dataForServer() {
  const { cache, ...data } = S;
  data.settings = { ...S.settings };
  delete data.settings.backend;          // the server address stays per browser
  return data;
}
async function pushRemote() {
  if (remote.sending) return;
  remote.sending = true;
  remote.dirty = false;
  const sentRev = remote.rev;
  try {
    const r = await fetch(apiBase() + '/api/data', {
      method: 'PUT',
      headers: { 'Content-Type': 'application/json', 'If-Match': String(sentRev) },
      body: JSON.stringify(dataForServer())
    });
    if (r.status === 409) {
      remote.sending = false;
      await syncFromServer();
      remote.state = 'conflict';
      updateSyncNote();
      render();
      return;
    }
    if (!r.ok) throw new Error('HTTP ' + r.status);
    const d = await r.json();
    if (typeof d.rev === 'number') remote.rev = d.rev;
    remote.state = remote.dirty ? 'saving' : 'saved';
  } catch (e) { remote.state = 'error'; }
  remote.sending = false;
  updateSyncNote();
  if (remote.dirty && remote.on) pushRemote();
}
function syncText() {
  return {
    off: '', saving: 'Saving…', saved: '',
    error: 'Could not save to data.json',
    conflict: 'data.json changed elsewhere. Reloaded the saved copy.'

}
function updateSyncNote() { const el = document.getElementById('sync'); if (el) el.textContent = syncText(); }
async function syncFromServer() {

  try {
    const r = await fetch(apiBase() + '/api/data');
    if (!r.ok) throw new Error('HTTP ' + r.status);
    const d = await r.json();
    remote.on = true;
    remote.rev = typeof d.rev === 'number' ? d.rev : 0;
    remote.dirty = false;
    if (d.exists && d.data) {                       // the file on disk is the source of truth
      const cache = S.cache, backend = S.settings.backend;
      S = merge(d.data); S.cache = cache; S.settings.backend = backend;
      try { localStorage.setItem(KEY, JSON.stringify(S)); } catch (e) {}
      remote.state = 'saved';
    } else if (KEYS_COUNT() > 0) {                  // first run with the file: move browser data into it
      remote.state = 'saving'; pushRemote();

}
const KEYS_COUNT = () => ['us', 'in', 'bcash', 'bank', 'pf', 'other'].reduce((a, k) => a + S[k].length, 0);

let live = {};                       // symbol -> live quote from the server
let status = { state: 'loading' };
let tab = 'overview';
let book = 'overview';

const CAT = {

  in:    { name: 'Indian stocks', color: '--c-in',    tab: 'in' },
  bcash: { name: 'Broker cash',   color: '--c-bcash', tab: 'cash' },

const KEYS = Object.keys(CAT);
const SRC = { live: 'live', manual: 'fallback', last: 'last known', cost: 'no price' };

/* ---------- live quotes ---------- */
function apiBase() {
  const b = (S.settings.backend || '').trim();
  if (b) return b.replace(/\/$/, '');
  return location.protocol === 'file:' ? 'http://localhost:8787' : '';
}
function ySym(kind, h) {
  const s = (h.symbol || '').trim().toUpperCase();
  if (!s) return '';
  if (kind === 'in') return /\.(NS|BO)$/.test(s) ? s : s + (h.exchange === 'BSE' ? '.BO' : '.NS');
  return s;
}
function usesThb() {
  return ['bcash', 'bank', 'other'].some(k => (S[k] || []).some(h => h.currency === 'THB'));
}
function allSymbols() {
  const set = new Set(['USDINR=X']);
  if (usesThb()) set.add('USDTHB=X');
  ['us', 'in', 'other'].forEach(k => S[k].forEach(h => { const s = ySym(k, h); if (s) set.add(s); }));
  return [...set];
}
async function loadQuotes() {
  status = { state: 'loading' };
  render();
  const syms = allSymbols();
  try {
    const ctl = new AbortController();
    const timer = setTimeout(() => ctl.abort(), 20000);
    const r = await fetch(apiBase() + '/api/quotes?symbols=' + encodeURIComponent(syms.join(',')), { signal: ctl.signal });
    clearTimeout(timer);
    if (!r.ok) throw new Error('HTTP ' + r.status);
    const d = await r.json();
    live = {};
    const bad = [];
    for (const s of syms) {
      const q = d.quotes && d.quotes[s];
      if (q && q.price != null) { live[s] = q; S.cache.quotes[s] = { price: q.price, at: Date.now() }; }
      else bad.push(s);
    }
    save();
    status = bad.length === syms.length
      ? { state: 'offline', msg: 'The server answered, but Yahoo returned no quotes. Check your internet connection.' }
      : { state: bad.length ? 'partial' : 'live', at: new Date(), bad };
  } catch (e) {
    live = {};
    status = { state: 'offline', msg: 'Price server not reachable.' };
  }
  render();
}

/* pick the best available price: live, else newest of fallback / last known, else none */
function pick(sym, manual, manualAt) {
  const l = live[sym];
  if (l && l.price != null) return { p: l.price, prev: l.prev, src: 'live' };
  const c = [];
  if (manual != null && manual !== '') c.push({ p: +manual, prev: null, src: 'manual', at: manualAt || 0 });
  const k = S.cache.quotes[sym];
  if (k) c.push({ p: k.price, prev: null, src: 'last', at: k.at });
  c.sort((a, b) => b.at - a.at);
  return c[0] || null;
}
function fxPair(sym, manual, manualAt, fallback) {
  const pr = pick(sym, manual, manualAt);
  return pr && pr.p > 0 ? { rate: pr.p, src: pr.src } : { rate: fallback, src: 'cost' };
}
function fxInfo() {
  const usdInr = fxPair('USDINR=X', S.settings.fxManual, S.settings.fxManualAt, 85);
  const usdThb = fxPair('USDTHB=X', S.settings.thbManual, S.settings.thbManualAt, 33);
  return { rate: usdInr.rate, src: usdInr.src, thb: usdThb.rate, thbSrc: usdThb.src };
}

/* ---------- calculations ---------- */
function compute() {
  const base = S.settings.base;
  const fx = fxInfo();
  const conv = (v, cur) => {
    if (cur === base) return v;
    let usd;
    if (cur === 'USD') usd = v;
    else if (cur === 'INR') usd = v / fx.rate;
    else if (cur === 'THB') usd = v / fx.thb;
    else usd = base === 'INR' ? v : v / fx.rate;
    return base === 'USD' ? usd : usd * fx.rate;
  };

  const stocks = (kind, cur) => S[kind].map(h => {
    const sym = ySym(kind, h);
    const pr = sym ? pick(sym, h.manualPrice, h.manualAt) : null;
    const price = pr ? pr.p : null;
    const cost = (h.qty || 0) * (h.avg || 0);
    const value = price != null ? (h.qty || 0) * price : cost;
    const pnl = value - cost;
    const day = pr && pr.src === 'live' && pr.prev != null ? (h.qty || 0) * (price - pr.prev) : null;
    return { ...h, cur, sym, price, src: pr ? pr.src : 'cost', cost, value, pnl,
      pnlPct: cost ? pnl / cost * 100 : null,
      valueBase: conv(value, cur), costBase: conv(cost, cur), pnlBase: conv(pnl, cur),
      dayBase: day != null ? conv(day, cur) : null };
  });
  const cash = kind => S[kind].map(h => ({ ...h, cur: h.currency, value: h.balance || 0, valueBase: conv(h.balance || 0, h.currency) }));
  const pf = S.pf.map(h => ({ ...h, cur: 'INR', value: h.balance || 0, valueBase: conv(h.balance || 0, 'INR') }));
  const other = S.other.map(h => {
    const sym = ySym('other', h);
    let price = null, src = 'manual', value = h.value || 0, day = null;
    if (sym) {
      const pr = pick(sym, h.price, h.priceAt);
      if (pr) {
        price = pr.p; src = pr.src; value = (h.qty || 0) * pr.p;
        if (pr.src === 'live' && pr.prev != null) day = (h.qty || 0) * (pr.p - pr.prev);
      } else { src = 'cost'; }
    }
    return { ...h, cur: h.currency, sym, price, src, value, valueBase: conv(value, h.currency), dayBase: day != null ? conv(day, h.currency) : null };
  });

  const cats = { us: { items: stocks('us', 'USD') }, in: { items: stocks('in', 'INR') },
    bcash: { items: cash('bcash') }, bank: { items: cash('bank') }, pf: { items: pf }, other: { items: other } };
  let net = 0, day = 0, hasDay = false;
  for (const k of KEYS) {
    const c = cats[k];
    c.total = c.items.reduce((a, h) => a + h.valueBase, 0);
    c.pnl = c.items.reduce((a, h) => a + (h.pnlBase || 0), 0);
    c.hasPnl = k === 'us' || k === 'in';
    net += c.total;
    c.items.forEach(h => { if (h.dayBase != null) { day += h.dayBase; hasDay = true; } });
  }
  const hasThb = usesThb();
  return { base, fx, conv, cats, net, day, hasDay, hasThb, count: KEYS.reduce((a, k) => a + cats[k].items.length, 0) };
}

/* ---------- formatting ---------- */
const money = (v, cur, dec = 0) => new Intl.NumberFormat(cur === 'INR' ? 'en-IN' : cur === 'THB' ? 'th-TH' : 'en-US',
  { style: 'currency', currency: cur, minimumFractionDigits: dec, maximumFractionDigits: dec }).format(v);
const M = (v, cur, dec = 0) => `<span class="num">${money(v, cur, dec)}</span>`;
const Sg = (v, cur, dec = 0) => `<span class="num">${v >= 0 ? '+' : '−'}${money(Math.abs(v), cur, dec)}</span>`;
const pct = v => `${v >= 0 ? '+' : '−'}${Math.abs(v).toFixed(2)}%`;
const cls = v => v > 0.0000001 ? 'gain' : v < -0.0000001 ? 'loss' : '';
const qty = v => {
  const n = Number(v) || 0;
  const max = Math.abs(n) >= 10 ? 2 : 4;
  return new Intl.NumberFormat('en-US', { maximumFractionDigits: max }).format(n);
};
function compact(v, cur) {
  if (cur === 'INR') {
    const a = Math.abs(v), s = v < 0 ? '−' : '';
    if (a >= 1e7) return `${s}₹${(a / 1e7).toFixed(2)} Cr`;
    if (a >= 1e5) return `${s}₹${(a / 1e5).toFixed(2)} L`;
    return money(v, 'INR');
  }
  return new Intl.NumberFormat('en-US', { style: 'currency', currency: 'USD', notation: 'compact', maximumFractionDigits: 2 }).format(v);
}
function groupBy(items, key) {
  const m = [];
  const ix = new Map();
  for (const h of items) {
    const name = (h[key] || '').trim() || 'Unnamed';
    if (!ix.has(name)) { ix.set(name, m.length); m.push([name, []]); }
    m[ix.get(name)][1].push(h);
  }
  m.sort((a, b) => b[1].reduce((s, h) => s + h.valueBase, 0) - a[1].reduce((s, h) => s + h.valueBase, 0));
  return m;
}

function foldSlices(parts, max = 7) {
  const pos = parts.filter(p => p.value > 0).sort((a, b) => b.value - a.value);
  if (pos.length <= max) return pos;
  const head = pos.slice(0, max - 1);
  const rest = pos.slice(max - 1);
  head.push({ name: 'Other', value: rest.reduce((s, p) => s + p.value, 0), color: 'var(--muted)' });
  return head;
}
function donut(parts, opt = {}) {
  let slices = foldSlices(parts, opt.max || 7);
  const total = slices.reduce((a, p) => a + p.value, 0);
  if (slices.length < 2 || total <= 0) return '';
  slices = slices.map((p, i) => ({
    ...p,
    color: p.color || `var(--s${(i % 8) + 1})`
  }));
  const cur = opt.cur || S.settings.base;
  const size = opt.size || 168;
  const sw = Math.round(size * 0.22);
  const r = size / 2 - sw / 2 - 1;
  const circ = 2 * Math.PI * r;
  const gap = slices.length > 1 ? Math.min(6, circ * 0.016) : 0;
  const usable = Math.max(circ - gap * slices.length, 1);
  const cx = size / 2, cy = size / 2;
  let at = 0;
  const rings = slices.map(p => {
    const len = (p.value / total) * usable;
    const pctN = (p.value / total * 100).toFixed(1);
    const node = `<circle class="slice" cx="${cx}" cy="${cy}" r="${r}" fill="none" stroke="${p.color}" stroke-width="${sw}"
      stroke-dasharray="${len.toFixed(3)} ${circ.toFixed(3)}" stroke-dashoffset="${(-at).toFixed(3)}"
      transform="rotate(-90 ${cx} ${cy})"
      data-name="${esc(p.name)}" data-pct="${pctN}%" data-val="${esc(money(p.value, cur))}"></circle>`;
    at += len + gap;
    return node;
  });
  const label = `Allocation: ${slices.map(p => `${p.name} ${(p.value / total * 100).toFixed(0)}%`).join(', ')}`;
  return `<div class="donut${opt.intro ? ' intro' : ''}" role="img" aria-label="${esc(label)}" style="width:${size}px;height:${size}px">
    <svg viewBox="0 0 ${size} ${size}" width="${size}" height="${size}">${rings.join('')}</svg>
  </div>`;
}
/* ---------- views ---------- */
function statusBar() {
  const s = status;
  let short = 'Fetching…', title = 'Fetching live prices';
  if (s.state === 'live') {
    short = `Live · ${s.at.toLocaleTimeString([], { hour: 'numeric', minute: '2-digit' })}`;
    title = 'Live prices. Click to refresh.';
  } else if (s.state === 'partial') {
    short = s.bad.length === 1 ? `Partial · ${s.bad[0]}` : `Partial · ${s.bad.length} missing`;
    title = `No quote for ${s.bad.join(', ')}. Using fallback prices. Click to refresh.`;
  } else if (s.state === 'offline') {

  } else if (s.state === 'loading') {

  }
  const sync = syncText();
  return `<div class="status ${s.state}" role="status">

function hero(c, short) {
  const other = c.base === 'INR' ? 'USD' : 'INR';
  const otherVal = compact(c.base === 'INR' ? c.net / c.fx.rate : c.net * c.fx.rate, other);
  const fxLabel = { live: 'live', manual: 'your fallback rate', last: 'last known', cost: 'default, set yours in Settings' }[c.fx.src];
  const thbLabel = { live: 'live', manual: 'your fallback rate', last: 'last known', cost: 'default, set yours in Settings' }[c.fx.thbSrc];
  const thbBit = c.hasThb ? `<span>1 USD = ฿${c.fx.thb.toFixed(2)} (${thbLabel})</span>` : '';
  const dayPct = c.net - c.day ? c.day / (c.net - c.day) * 100 : 0;
  const day = c.hasDay ? `<p class="day ${cls(c.day)}">Market moves today: ${Sg(c.day, c.base)} <span class="num">(${pct(dayPct)})</span></p>` : '';
  const sub = short ? '' : `<div class="sub"><span class="num">≈ ${otherVal}</span><span>1 USD = ₹${c.fx.rate.toFixed(2)} (${fxLabel})</span>${thbBit}</div>`;
  return `<section class="hero${short ? ' compact' : ''}">
    <p class="hero-label">${short ? 'Net worth' : 'Total net worth'}</p>
    <h1 class="total num">${money(c.net, c.base)}</h1>
    ${sub}
    ${day}
  </section>`;
}

const SHORT = { us: 'US', in: 'India', bcash: 'Broker', bank: 'Bank', pf: 'PF', other: 'Other' };
function shareOf(part, total) { return total ? (part / total * 100).toFixed(1) : '0.0'; }
function catBars(c) {
  const items = KEYS.filter(k => c.cats[k].total > 0);
  if (!items.length) return '<p class="empty">Nothing to chart yet.</p>';
  const max = Math.max(...items.map(k => c.cats[k].total));
  const W = 360, H = 168, pad = 8, gap = 16;
  const bw = (W - pad * 2 - gap * (items.length - 1)) / items.length;
  const bars = items.map((k, i) => {
    const bh = Math.max(6, (c.cats[k].total / max) * (H - 28));
    const x = pad + i * (bw + gap);
    const y = H - 20 - bh;
    const fill = i % 2 === 0 ? 'var(--accent)' : 'var(--muted)';
    const opacity = i % 2 === 0 ? 1 : 0.45;
    return `<rect x="${x.toFixed(1)}" y="${y.toFixed(1)}" width="${bw.toFixed(1)}" height="${bh.toFixed(1)}" rx="7" fill="${fill}" opacity="${opacity}"></rect>
      <text x="${(x + bw / 2).toFixed(1)}" y="${H - 4}" text-anchor="middle" fill="var(--muted)" font-size="11">${esc(SHORT[k])}</text>`;
  }).join('');
  const label = items.map(k => `${CAT[k].name} ${money(c.cats[k].total, c.base)}`).join(', ');
  return `<svg class="bars" viewBox="0 0 ${W} ${H}" role="img" aria-label="${esc(label)}">${bars}</svg>`;
}
function progressList(rows) {
  if (!rows.length) return '<p class="empty">Nothing here yet.</p>';
  const max = Math.max(...rows.map(r => r.value), 1);
  return rows.map((r, i) => `<div class="prow">
    <div class="prow-top"><span>${esc(r.name)}</span><b class="num">${r.label}</b></div>
    <div class="track"><i class="${i % 2 ? 'alt' : ''}" style="width:${Math.max(4, r.value / max * 100).toFixed(1)}%"></i></div>
  </div>`).join('');
}
function viewOverview(c) {
  if (!c.count) {
    return `<div class="start"><h2>Start with your first holding</h2>
      <p>Add stocks, cash balances, PF and other assets from the sidebar. Prices and the USD/INR rate load automatically while the price server is running.</p>
      <div class="row"><button class="btn" data-act="tab" data-tab="us">Add US stocks</button>
      <button class="btn ghost" data-act="sample">Load sample data</button></div></div>`;
  }
  const stocks = c.cats.us.total + c.cats.in.total;
  const cash = c.cats.bcash.total + c.cats.bank.total;
  const rest = c.cats.pf.total + c.cats.other.total;
  const other = c.base === 'INR' ? 'USD' : 'INR';
  const otherVal = compact(c.base === 'INR' ? c.net / c.fx.rate : c.net * c.fx.rate, other);
  const dayPct = c.net - c.day ? c.day / (c.net - c.day) * 100 : 0;
  const netSub = c.hasDay
    ? `<p class="kpi-sub ${cls(c.day)}">${Sg(c.day, c.base)} today <span class="num">(${pct(dayPct)})</span></p>`
    : `<p class="kpi-sub num">≈ ${otherVal}</p>`;
  const kpi = (label, value, sub) => `<article class="kpi"><p class="kpi-label">${label}</p><p class="kpi-value num">${value}</p>${sub}</article>`;
  const kpis = `<div class="kpis">
    ${kpi('Net worth', money(c.net, c.base), netSub)}
    ${kpi('Stocks', money(stocks, c.base), `<p class="kpi-sub num">${shareOf(stocks, c.net)}% of net worth</p>`)}
    ${kpi('Cash', money(cash, c.base), `<p class="kpi-sub num">${shareOf(cash, c.net)}% of net worth</p>`)}
    ${kpi('PF & other', money(rest, c.base), `<p class="kpi-sub num">${shareOf(rest, c.net)}% of net worth</p>`)}
  </div>`;

  const segs = KEYS.filter(k => c.cats[k].total > 0).map(k => ({ name: CAT[k].name, short: SHORT[k], value: c.cats[k].total, color: `var(${CAT[k].color})`, tab: CAT[k].tab }));
  const mix = donut(segs, { size: 148, cur: c.base, intro: !introDone });
  const legend = `<ul class="legend">${segs.map(p => `<li><button type="button" data-act="tab" data-tab="${p.tab}" title="${esc(p.name)}">
    <i class="sw" style="background:${p.color}"></i><span>${esc(p.short)}</span><b class="num">${shareOf(p.value, c.net)}%</b></button></li>`).join('')}</ul>`;

  const holds = [];
  c.cats.us.items.forEach(h => holds.push({ name: h.symbol, value: h.valueBase }));
  c.cats.in.items.forEach(h => holds.push({ name: h.symbol, value: h.valueBase }));
  c.cats.other.items.forEach(h => holds.push({ name: h.label || h.sym || 'Asset', value: h.valueBase }));
  holds.sort((a, b) => b.value - a.value);
  const topHolds = holds.slice(0, 5).map(h => ({ ...h, label: money(h.value, c.base) }));

  const g = {};
  const add = (name, v) => { name = (name || '').trim() || 'Unnamed'; g[name] = (g[name] || 0) + v; };
  c.cats.us.items.forEach(h => add(h.broker, h.valueBase));
  c.cats.in.items.forEach(h => add(h.broker, h.valueBase));
  c.cats.bcash.items.forEach(h => add(h.broker, h.valueBase));
  c.cats.bank.items.forEach(h => add(h.bank, h.valueBase));
  c.cats.pf.items.forEach(h => add(h.label, h.valueBase));
  c.cats.other.items.forEach(h => add(h.label, h.valueBase));
  const inst = Object.entries(g).map(([n, t]) => ({ name: n, value: t, label: money(t, c.base) })).filter(i => i.value !== 0).sort((a, b) => b.value - a.value).slice(0, 5);

  const movers = [];
  ['us', 'in', 'other'].forEach(k => c.cats[k].items.forEach(h => {
    if (h.dayBase != null && h.dayBase !== 0) movers.push({ name: h.symbol || h.label, day: h.dayBase });
  }));
  movers.sort((a, b) => Math.abs(b.day) - Math.abs(a.day));
  const activity = movers.length
    ? `<ul class="activity">${movers.slice(0, 5).map(m => `<li><span><i class="dotc" style="background:${m.day >= 0 ? 'var(--gain)' : 'var(--loss)'}"></i>${esc(m.name)}</span><span class="${cls(m.day)} num">${Sg(m.day, c.base)}</span><span class="when">today</span></li>`).join('')}</ul>`
    : '<p class="empty">No live moves yet. Prices show up here after a refresh.</p>';

  const priceWord = { loading: 'Fetching', live: 'Live', partial: 'Partial', offline: 'Offline' }[status.state] || 'Prices';
  const priceWhen = status.state === 'live' && status.at
    ? status.at.toLocaleTimeString([], { hour: 'numeric', minute: '2-digit' })
    : (status.state === 'offline' ? 'Server unreachable' : 'Waiting for quotes');
  const prices = `<p class="status-big ${esc(status.state)}">${esc(priceWord)}</p>
    <p class="kpi-sub">${esc(priceWhen)}</p>
    <div class="stat-pills">
      <div class="pill"><b class="num">₹${c.fx.rate.toFixed(2)}</b><span>USD / INR</span></div>
      <div class="pill"><b class="num">${c.count}</b><span>Holdings</span></div>
    </div>`;

  return `${kpis}
    <div class="charts">
      <section class="card"><h3>By category</h3>${catBars(c)}</section>
      <section class="card"><h3>Mix</h3><div class="mix">${mix}${legend}</div></section>
      <section class="card"><h3>Prices</h3>${prices}</section>
    </div>
    <div class="lower">
      <section class="card"><h3>Largest holdings</h3>${progressList(topHolds)}</section>
      <section class="card"><h3>By institution</h3>${progressList(inst)}</section>
      <section class="card"><h3>Today</h3>${activity}</section>
    </div>`;
}

const sorts = {};
function table(cols, rows, empty, opt) {
  if (!rows.length) return `<p class="empty">${empty}</p>`;
  const wide = opt === 'wide' || (opt && opt.wide);
  const sid = (opt && opt.id) || '';
  const state = sid && sorts[sid];
  const head = cols && cols.length
    ? `<thead><tr>${cols.map((c, i) => {
        if (!c.h) return `<th></th>`;
        const on = state && state.col === i;
        const aria = on ? (state.dir < 0 ? 'descending' : 'ascending') : 'none';
        const clsName = [c.r ? 'r' : '', c.sm ? 'hide-sm' : ''].filter(Boolean).join(' ');
        return `<th class="${clsName}" aria-sort="${aria}"><button type="button" class="sort" data-act="sort" data-col="${i}">${c.h}</button></th>`;
      }).join('')}</tr></thead>`
    : '';
  return `<div class="tw"><table class="${wide ? 'wide' : ''}" ${sid ? `data-sid="${esc(sid)}"` : ''}>${head}<tbody>${rows.join('')}</tbody></table></div>`;
}
function cellKey(td) {
  if (!td) return '';
  if (td.dataset.v != null && td.dataset.v !== '') {
    const n = Number(td.dataset.v);
    return Number.isNaN(n) ? td.dataset.v.toLowerCase() : n;
  }
  return td.innerText.trim().toLowerCase();
}
function applySort(tableEl, col, dir) {
  const body = tableEl.tBodies[0];
  if (!body) return;
  [...body.rows].sort((a, b) => {
    const av = cellKey(a.cells[col]), bv = cellKey(b.cells[col]);
    const c = typeof av === 'number' && typeof bv === 'number' ? av - bv : String(av).localeCompare(String(bv));
    return c * dir;
  }).forEach(r => body.appendChild(r));
  [...tableEl.tHead.rows[0].cells].forEach((th, i) => {
    if (!th.querySelector('.sort')) return;
    th.setAttribute('aria-sort', i === col ? (dir < 0 ? 'descending' : 'ascending') : 'none');
  });
}
function applySorts() {
  document.querySelectorAll('table[data-sid]').forEach(tableEl => {
    const s = sorts[tableEl.dataset.sid];
    if (s) applySort(tableEl, s.col, s.dir);
  });
}
const acts = (k, id, extra = '') => `<td class="r act">${extra}<button class="lnk" data-act="edit" data-k="${k}" data-id="${id}">Edit</button><button class="lnk del" data-act="del" data-k="${k}" data-id="${id}">Delete</button></td>`;
const head = (title, total, k, label) => `<div class="head"><h2>${title}</h2><span class="tot">${total}</span><button class="btn" data-act="add" data-k="${k}">${label}</button></div>`;
const srcNote = h => h.src && h.src !== 'live' ? `<span class="src src-${h.src}">${SRC[h.src]}</span>` : '';

function viewStocks(kind, c) {
  const x = c.cats[kind];
  const cur = kind === 'us' ? 'USD' : 'INR';
  const groups = groupBy(x.items, 'broker');
  const stockCols = [{ h: 'Symbol' }, { h: 'Qty', r: 1, sm: 1 }, { h: 'Price', r: 1, sm: 1 }, { h: 'Avg', r: 1, sm: 1 }, { h: 'Value', r: 1 }, { h: 'P&L', r: 1 }, { h: '' }];
  const blocks = groups.map(([name, items]) => {
    const sub = items.reduce((a, h) => a + h.valueBase, 0);
    const rows = items.map(h => {
      const priceBit = h.price != null ? money(h.price, cur, 2) : '—';
      const src = h.src && h.src !== 'live' ? ` (${SRC[h.src]})` : '';
      const meta = [kind === 'in' ? (h.exchange || 'NSE') : '', `${qty(h.qty)} · ${priceBit}${src} · avg ${money(h.avg || 0, cur, 2)}`].filter(Boolean).join(' · ');
      return `<tr>
        <td data-v="${esc(h.symbol)}"><b>${esc(h.symbol)}</b>${kind === 'in' ? `<small class="hide-sm">${esc(h.exchange || 'NSE')}</small>` : ''}<small class="only-sm num">${esc(meta)}</small></td>

        <td class="r hide-sm" data-v="${h.price ?? ''}">${h.price != null ? M(h.price, cur, 2) : '—'}${srcNote(h)}</td>
        <td class="r hide-sm" data-v="${h.avg || 0}">${M(h.avg, cur, 2)}</td>
        <td class="r" data-v="${h.value || 0}">${M(h.value, cur)}</td>
        <td class="r ${cls(h.pnl)}" data-v="${h.pnl || 0}">${Sg(h.pnl, cur)}<small class="num">${h.pnlPct != null ? pct(h.pnlPct) : ''}</small></td>
        ${acts(kind, h.id)}</tr>`;
    });
    return `<div class="ghead"><h3>${esc(name)}</h3><span class="tot">${M(sub, c.base)}</span></div>

  }).join('');
  return `<div class="block">${head(CAT[kind].name, `Total <b>${M(x.total, c.base)}</b> · <span class="${cls(x.pnl)}">${Sg(x.pnl, c.base)}</span>`, kind, 'Add holding')}

}

function viewCash(c) {
  const groups = [['bcash', 'Broker cash', 'broker'], ['bank', 'Bank accounts', 'bank']];

    const x = c.cats[kind];

      const same = h.currency === c.base;
      const fx = showFx ? `<td class="r" data-v="${h.valueBase || 0}">${same ? '<span class="dash">—</span>' : M(h.valueBase || 0, c.base)}</td>` : '';

function viewPF(c) {
  const x = c.cats.pf;
  const showFx = c.base !== 'INR' && x.items.length > 0;
  const rows = x.items.map(h => {
    const link = `<button class="lnk contrib" data-act="contrib" data-id="${h.id}">Add contribution</button>`;

function applyQuery() {
  const q = query.trim().toLowerCase();
  document.querySelectorAll('#app tbody tr').forEach(tr => {
    tr.hidden = !!q && !tr.innerText.toLowerCase().includes(q);
  });
  document.querySelectorAll('#app .ghead').forEach(head => {
    const wrap = head.nextElementSibling;
    const rows = wrap ? wrap.querySelectorAll('tbody tr') : [];
    const any = [...rows].some(tr => !tr.hidden);
    head.hidden = !!q && !any;
    if (wrap) wrap.hidden = !!q && !any;
  });

const curF = { k: 'currency', label: 'Currency', type: 'select', opts: ['USD', 'INR', 'THB'] };
const FORMS = {
  us: { title: 'US stock', hint: 'Use the ticker as it appears on Yahoo Finance, for example AAPL or BRK-B.', fields: [brokerF,
    { k: 'symbol', label: 'Ticker', type: 'text', req: 1, upper: 1, ph: 'AAPL' },
    { k: 'qty', label: 'Quantity', type: 'number', req: 1 },
    { k: 'avg', label: 'Average buy price (USD)', type: 'number', req: 1 },
    { k: 'manualPrice', label: 'Fallback price (USD)', type: 'number', adv: 1, hint: 'Used only when live prices are unavailable.' }] },
  in: { title: 'Indian stock', hint: 'Enter the plain symbol, for example RELIANCE. The .NS or .BO suffix is added from the exchange you pick.', fields: [brokerF,
    { k: 'symbol', label: 'Symbol', type: 'text', req: 1, upper: 1, ph: 'RELIANCE' },
    { k: 'exchange', label: 'Exchange', type: 'select', opts: ['NSE', 'BSE'] },
    { k: 'qty', label: 'Quantity', type: 'number', req: 1 },
    { k: 'avg', label: 'Average buy price (INR)', type: 'number', req: 1 },
    { k: 'manualPrice', label: 'Fallback price (INR)', type: 'number', adv: 1, hint: 'Used only when live prices are unavailable.' }] },
  bcash: { title: 'Broker cash', fields: [brokerF, curF, { k: 'balance', label: 'Balance', type: 'number', req: 1 }] },
  bank: { title: 'Bank account', fields: [
    { k: 'bank', label: 'Bank', type: 'text', req: 1, ph: 'e.g. HDFC Bank' },
    { k: 'account', label: 'Account name', type: 'text', ph: 'Savings' }, curF,
    { k: 'balance', label: 'Balance', type: 'number', req: 1 }] },
  pf: { title: 'PF account', fields: [
    { k: 'label', label: 'Account name', type: 'text', req: 1, ph: 'EPF, current employer' },
    { k: 'balance', label: 'Balance (INR)', type: 'number', req: 1 }] },
  other: { title: 'Other asset', hint: 'Crypto with a Yahoo symbol such as BTC-USD updates live. Choose the currency the symbol is quoted in.', fields: [
    { k: 'label', label: 'Name', type: 'text', req: 1, ph: 'e.g. Bitcoin on Coinbase' }, curF,
    { k: 'symbol', label: 'Live symbol (optional)', type: 'text', upper: 1, ph: 'BTC-USD' },
    { k: 'qty', label: 'Quantity (with symbol)', type: 'number' },
    { k: 'value', label: 'Value (without symbol)', type: 'number', hint: 'Enter a value directly if there is no live symbol.' },
    { k: 'price', label: 'Fallback price (with symbol)', type: 'number', adv: 1, hint: 'Used only when live prices are unavailable.' }] },
  contrib: { title: 'PF contribution', fields: [
    { k: 'month', label: 'Month', type: 'month', req: 1 },
    { k: 'amount', label: 'Amount (INR)', type: 'number', req: 1 }] }
};
const DEF = { bank: { currency: 'INR' }, bcash: { currency: 'USD' }, other: { currency: 'USD' }, in: { exchange: 'NSE' } };

function fieldHtml(f, val) {
  const v = val[f.k] ?? '';
  const input = f.type === 'select'
    ? `<select id="f-${f.k}" name="${f.k}">${f.opts.map(o => `<option ${o === v ? 'selected' : ''}>${o}</option>`).join('')}</select>`
    : `<input id="f-${f.k}" name="${f.k}" type="${f.type}" ${f.type === 'number' ? 'step="any"' : ''} value="${esc(v)}" ${f.list ? `list="${f.list}"` : ''} ${f.ph ? `placeholder="${esc(f.ph)}"` : ''} ${f.req ? 'required' : ''}>`;
  return `<div class="field"><label for="f-${f.k}">${f.label}</label>${input}${f.hint ? `<span class="hint">${f.hint}</span>` : ''}</div>`;
}

function openForm(kind, id) {
  const F = FORMS[kind];
  let val = {};
  if (kind === 'contrib') val = { month: new Date().toISOString().slice(0, 7) };
  else if (id) val = S[kind].find(x => x.id === id) || {};
  else val = { ...(DEF[kind] || {}) };
  editing = { kind, id };
  const names = new Set();
  ['us', 'in', 'bcash'].forEach(k => S[k].forEach(h => h.broker && names.add(h.broker)));
  $('#brokers').innerHTML = [...names].map(n => `<option value="${esc(n)}">`).join('');
  const title = kind === 'contrib' ? F.title : `${id ? 'Edit' : 'Add'} ${F.title}`;
  const main = F.fields.filter(f => !f.adv);
  const adv = F.fields.filter(f => f.adv);
  const advOpen = adv.some(f => val[f.k] != null && val[f.k] !== '');
  $('#frm').innerHTML = `<h2 id="dlg-title" style="margin-bottom:16px">${title}</h2>`
    + main.map(f => fieldHtml(f, val)).join('')
    + (F.hint ? `<p class="hint">${F.hint}</p>` : '')
    + (adv.length ? `<details class="adv"${advOpen ? ' open' : ''}><summary>Fallback price</summary>${adv.map(f => fieldHtml(f, val)).join('')}</details>` : '')
    + `<p class="err" id="ferr" role="alert"></p><div class="actions"><button type="button" class="btn ghost" data-act="cancel">Cancel</button><button type="submit" class="btn">Save</button></div>`;
  $('#dlg').showModal();
  const first = $('#frm input, #frm select'); if (first) first.focus();
}

$('#frm').addEventListener('submit', e => {
  e.preventDefault();
  const { kind, id } = editing;
  const F = FORMS[kind];
  const fd = new FormData(e.target);
  const o = {};
  for (const f of F.fields) {
    let v = String(fd.get(f.k) ?? '').trim();
    if (f.type === 'number') o[f.k] = v === '' ? null : parseFloat(v);
    else o[f.k] = f.upper ? v.toUpperCase() : v;
  }
  const err = m => { $('#ferr').textContent = m; };

  if (kind === 'contrib') {
    const h = S.pf.find(x => x.id === id);
    h.balance = (h.balance || 0) + o.amount;
    h.log = (h.log || []).concat({ month: o.month, amount: o.amount });
  } else {
    if (kind === 'other' && !(o.symbol && o.qty != null) && o.value == null) return err('Enter a live symbol with a quantity, or a value.');
    const prev = id ? S[kind].find(x => x.id === id) : null;
    if (kind === 'us' || kind === 'in' || kind === 'other') {
      const mk = kind === 'other' ? 'price' : 'manualPrice', ak = kind === 'other' ? 'priceAt' : 'manualAt';
      if (o[mk] == null) o[ak] = 0;
      else o[ak] = prev && prev[mk] === o[mk] ? (prev[ak] || 0) : Date.now();
    }
    if (prev) Object.assign(prev, o); else S[kind].push({ id: uid(), ...o });
  }
  save();
  $('#dlg').close();
  if (['us', 'in', 'other'].includes(kind)) loadQuotes(); else render();
});

/* ---------- actions ---------- */
function sample() {
  S.us.push({ id: uid(), broker: 'Sample Broker US', symbol: 'AAPL', qty: 10, avg: 170, manualPrice: null, manualAt: 0 },
            { id: uid(), broker: 'Sample Broker US', symbol: 'MSFT', qty: 5, avg: 320, manualPrice: null, manualAt: 0 });
  S.in.push({ id: uid(), broker: 'Sample Broker IN', symbol: 'RELIANCE', exchange: 'NSE', qty: 50, avg: 2400, manualPrice: null, manualAt: 0 },
            { id: uid(), broker: 'Sample Broker IN', symbol: 'TCS', exchange: 'NSE', qty: 20, avg: 3300, manualPrice: null, manualAt: 0 });
  S.bcash.push({ id: uid(), broker: 'Sample Broker US', currency: 'USD', balance: 1500 });
  S.bank.push({ id: uid(), bank: 'Sample Bank', account: 'Savings', currency: 'INR', balance: 350000 });
  S.pf.push({ id: uid(), label: 'Sample EPF', balance: 800000, log: [] });
  S.other.push({ id: uid(), label: 'Sample Bitcoin', currency: 'USD', symbol: 'BTC-USD', qty: 0.05, price: null, priceAt: 0, value: null });
  save(); loadQuotes();
}
function download(name, text) {
  const a = document.createElement('a');
  a.href = URL.createObjectURL(new Blob([text], { type: 'application/json' }));
  a.download = name; document.body.appendChild(a); a.click(); a.remove();
  setTimeout(() => URL.revokeObjectURL(a.href), 1000);
}

document.addEventListener('keydown', e => {
  if (e.key !== 'Enter' && e.key !== ' ') return;
  const row = e.target.closest && e.target.closest('tr[data-act]');
  if (!row) return;
  e.preventDefault();
  row.click();
});
document.addEventListener('click', e => {
  const t = e.target.closest('[data-act]');
  if (!t) return;
  const act = t.dataset.act, k = t.dataset.k, id = t.dataset.id;
  if (act === 'sort') {
    const tableEl = t.closest('table');
    const id = tableEl && tableEl.dataset.sid;
    if (!id) return;
    const col = +t.dataset.col;
    const prev = sorts[id];
    const dir = prev && prev.col === col ? -prev.dir : (t.closest('th').classList.contains('r') ? -1 : 1);
    sorts[id] = { col, dir };
    applySort(tableEl, col, dir);
  }
  else if (act === 'tab') {
    const next = t.dataset.tab;
    if (next === 'settings') { if (tab !== 'settings') book = tab; }
    else book = next;
    tab = next; render(); window.scrollTo({ top: 0 });
  }
  else if (act === 'base') { S.settings.base = t.dataset.cur; save(); render(); }
  else if (act === 'mask') { S.settings.mask = !S.settings.mask; save(); render(); }
  else if (act === 'mode') { S.settings.mode = resolveMode() === 'dark' ? 'light' : 'dark'; save(); render(); }
  else if (act === 'theme') {
    const mode = resolveMode();
    if (!S.settings.palette || typeof S.settings.palette !== 'object') S.settings.palette = { light: 'navy', dark: 'brass' };
    S.settings.palette[mode] = t.dataset.theme;
    save(); render();
  }
  else if (act === 'refresh') loadQuotes();
  else if (act === 'add') openForm(k);
  else if (act === 'edit') openForm(k, id);
  else if (act === 'contrib') openForm('contrib', id);
  else if (act === 'cancel') $('#dlg').close();
  else if (act === 'del') {
    if (confirm('Delete this entry?')) { S[k] = S[k].filter(x => x.id !== id); save(); render(); }
  }
  else if (act === 'sample') sample();
  else if (act === 'export') {
    const { cache, ...data } = S;
    download(`networth-backup-${new Date().toISOString().slice(0, 10)}.json`, JSON.stringify(data, null, 2));
  }
  else if (act === 'import') $('#file').click();
  else if (act === 'reset') {
    if (confirm('Erase all holdings and settings from this browser? Export a backup first if unsure.')) {
      try { localStorage.removeItem(KEY); } catch (e) {}
      S = defaults(); live = {}; save(); render(); loadQuotes();
    }
  }
});

document.addEventListener('input', e => {
  if (e.target.id !== 'q') return;
  query = e.target.value;
  applyQuery();
});
document.addEventListener('change', e => {
  const t = e.target;
  if (t.dataset.set === 'backend') { remote.on = false; S.settings.backend = t.value.trim(); save(); syncFromServer().then(loadQuotes); }
  if (t.dataset.set === 'fx' || t.dataset.set === 'thb') {
    const v = parseFloat(t.value);
    const manual = t.dataset.set === 'fx' ? 'fxManual' : 'thbManual';
    const at = t.dataset.set === 'fx' ? 'fxManualAt' : 'thbManualAt';
    S.settings[manual] = isNaN(v) ? null : v; S.settings[at] = Date.now(); save(); render();
  }
});

$('#file').addEventListener('change', e => {
  const f = e.target.files[0]; if (!f) return;
  const r = new FileReader();
  r.onload = () => {
    try {
      const d = JSON.parse(r.result);
      if (!d || typeof d !== 'object' || !('us' in d || 'bank' in d || 'settings' in d)) throw new Error('bad file');
      const cache = S.cache;
      S = merge(d); S.cache = cache; save(); loadQuotes();
    } catch (err) { alert('That file is not a valid backup from this tracker.'); }
    e.target.value = '';
  };
  r.readAsText(f);
});

function showTip(slice, x, y) {
  const tip = document.getElementById('tip');
  if (!tip || !slice) return;
  tip.hidden = false;
  tip.replaceChildren();
  const name = document.createElement('b');
  name.textContent = slice.dataset.name || '';
  const pct = document.createElement('div');
  pct.textContent = slice.dataset.pct || '';
  const val = document.createElement('div');
  val.className = 'num';
  val.textContent = slice.dataset.val || '';
  tip.append(name, pct, val);
  const w = 180, h = 72;
  tip.style.left = Math.min(x + 14, window.innerWidth - w) + 'px';
  tip.style.top = Math.min(y + 14, window.innerHeight - h) + 'px';
}
document.addEventListener('pointerover', e => {
  const slice = e.target.closest && e.target.closest('.slice');
  if (slice) showTip(slice, e.clientX, e.clientY);
});
document.addEventListener('pointermove', e => {
  const slice = e.target.closest && e.target.closest('.slice');
  if (slice) showTip(slice, e.clientX, e.clientY);
  else {
    const tip = document.getElementById('tip');
    if (tip && !tip.hidden) tip.hidden = true;
  }
});

applyTheme();
render();
syncFromServer().then(loadQuotes);
})();
</script>
</body>
</html>
